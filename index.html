    <!-- GÜVENLİK VE KAYNAK KORUMA (F12, İncele, Sağ Tık ve Kaynak Kod Engeli) -->
    <script>
      (function() {
        document.addEventListener('contextmenu', function(e) { e.preventDefault(); return false; }, true);
        document.addEventListener('keydown', function(e) {
          if (e.key === 'F12' || e.keyCode === 123) { e.preventDefault(); e.stopPropagation(); return false; }
          var ctrl = e.ctrlKey || e.metaKey;
          if (ctrl && (e.key === 'u' || e.key === 'U' || e.keyCode === 85)) { e.preventDefault(); return false; }
          if (ctrl && (e.key === 's' || e.key === 'S' || e.keyCode === 83)) { e.preventDefault(); return false; }
          if (ctrl && e.shiftKey && ['I','i','J','j','C','c'].indexOf(e.key) !== -1) { e.preventDefault(); return false; }
        }, true);
      })();
    </script>
